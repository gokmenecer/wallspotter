name: Daily recap Reel

# Every day at 23:00 Istanbul (20:00 UTC) a Reel of the day's wallpapers goes to Instagram and Threads.
# GitHub skips many scheduled runs, so this also runs hourly, and the 15-minute "Release scheduled wallpaper"
# check starts it whenever a Reel is still owed. A missed night is caught up the next day; a day is posted once.
on:
  schedule:
    - cron: "4,19,34,49 20-23 * * *"
    - cron: "27 * * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Day to post (YYYY-MM-DD); empty = the day that is due"
        required: false
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: daily-reel
  cancel-in-progress: false

jobs:
  reel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow

      - name: Pick the day's wallpapers
        id: prep
        env:
          DAILY_DAY: ${{ inputs.day }}
        run: python scripts/social.py dailyreel-prepare

      - name: Save, build the video with the site, and share
        if: steps.prep.outputs.day != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOCIAL_KEY: ${{ secrets.SOCIAL_KEY }}
        run: |
          git config user.name "wallspotter-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-reels.json
          git commit -m "Daily recap Reel: ${{ steps.prep.outputs.day }}"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
          # a push made with GITHUB_TOKEN does not start other workflows: start the site build ourselves
          gh workflow run deploy.yml --ref main
          sleep 20
          id=$(gh run list --workflow deploy.yml --event workflow_dispatch -L 1 --json databaseId -q '.[0].databaseId')
          gh run watch "$id" --exit-status || { gh run rerun "$id" --failed; sleep 20; gh run watch "$id" --exit-status; }
          python scripts/social.py dailyreel-post

      - name: Save what was shared
        if: always() && steps.prep.outputs.day != ''
        run: |
          git add data/daily-reels.json
          if ! git diff --cached --quiet; then
            git commit -m "Daily recap Reel shared"
            for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
          fi
